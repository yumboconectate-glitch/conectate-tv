services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conectate-tv-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conectate_tv
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: conectate-tv-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - conectate_tv

  nginx:
    image: nginx:1.28-alpine
    container_name: conectate-tv-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PANEL_BIND_IP:-0.0.0.0}:${PANEL_PORT:-8098}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - conectate_tv

  db:
    image: postgres:17-alpine
    container_name: conectate-tv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conectate_tv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: conectate-tv-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - conectate_tv
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  conectate_tv:
    driver: bridge
